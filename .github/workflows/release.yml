name: Test, build and release macOS
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Locate bundled ffmpeg for tests
        run: |
          python - <<'PY'
          import contextlib, io, os, shutil
          import static_ffmpeg
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              static_ffmpeg.add_paths()
          with open(os.environ['GITHUB_PATH'], 'a') as f:
              f.write(os.path.dirname(shutil.which('ffmpeg')) + '\n')
          PY
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Build, sign and smoke-test application
        env:
          PY: python
        run: bash build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-installer
          path: dist/**/*.dmg*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-installer
          path: release-assets
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'from version import APP_VERSION; print(APP_VERSION)')
          test "${GITHUB_REF_NAME}" = "v${version}"
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.sha256' \))
          test "${#assets[@]}" -eq 2
          gh release create "${GITHUB_REF_NAME}" --verify-tag --latest \
            --title "v${version} 音频分析（macOS · Apple Silicon）" \
            --notes-file RELEASE_NOTES.md "${assets[@]}"
